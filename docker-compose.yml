name: expenses

services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: expenses:latest
    container_name: expenses-streamlit
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8503}:8503"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8503
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      # Persist the AI category dictionary (grown by the categorization pipeline) into the container
      - ./data:/app/data

  dash:
    image: expenses:latest
    depends_on:
      - streamlit # builds the shared image
    container_name: expenses-dash
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "python", "dash_app.py"]
    ports:
      - "${DASH_PORT:-8050}:8050"
    env_file:
      - .env
    environment:
      - DASH_PORT=8050
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./data:/app/data
