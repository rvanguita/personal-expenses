name: expenses

# One service per app under app/, each built from its own Dockerfile with the repository root as
# build context (the apps share src/, data/ and template/).
services:
  streamlit:
    build:
      context: .
      dockerfile: app/streamlit/Dockerfile
    image: expenses-streamlit:latest
    container_name: expenses-streamlit
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8503}:8503"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8503
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      # Persist the AI category dictionary (grown by the categorization pipeline) into the container
      - ./data:/app/data

  dash:
    build:
      context: .
      dockerfile: app/dash/Dockerfile
    image: expenses-dash:latest
    container_name: expenses-dash
    restart: unless-stopped
    ports:
      - "${DASH_PORT:-8050}:8050"
    env_file:
      - .env
    environment:
      - DASH_PORT=8050
    volumes:
      - ./data:/app/data
