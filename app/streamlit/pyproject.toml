[project]
name = "expenses-streamlit"
version = "0.1.0"
description = "Streamlit app: analysis tabs plus ingest / categorize / manage over the medallion layers"
requires-python = ">=3.13"
dependencies = [
    "expenses",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
expenses = { workspace = true }
